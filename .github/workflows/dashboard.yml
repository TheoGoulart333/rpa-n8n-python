name: Atualizar dashboard do repositório

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/index.html"
      - "docs/summary.md"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
      - name: Gerar painel com dados do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 github_dashboard.py --summary
      - name: Abrir ou atualizar PR do dashboard
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: automation/dashboard
          delete-branch: true
          add-paths: |
            docs/index.html
            docs/summary.md
          commit-message: "chore: atualiza dashboard do repositório"
          title: "Atualiza dashboard do repositório"
          body: |
            Atualização automática dos arquivos do dashboard.

            Revise as mudanças e faça o merge para publicar a versão atualizada.
